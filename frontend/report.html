<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV System | Генератор Звітів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="manifest" href="/manifest.json">
    <script src="libs/FileSaver.min.js"></script>
    <meta name="theme-color" content="#16a34a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .input-premium {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 0.75rem;
            padding: 0.625rem 1rem;
            width: 100%;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.875rem;
        }

        .input-premium:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        .label-premium {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-premium {
            background: var(--primary);
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-premium:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .btn-premium:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(51, 65, 85, 0.8);
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 1rem;
            height: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .photo-preview {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 0.75rem;
            border: 2px solid var(--primary);
            transition: transform 0.2s;
        }

        .photo-preview:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">

        <header class="flex justify-between items-center mb-8 px-2">
            <div>
                <h1
                    class="text-4xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 uppercase">
                    Звітність
                </h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1 opacity-70">
                    Автоматизоване бойове донесення
                </p>
            </div>
            <button onclick="nav('/')" class="glass-card p-3 text-slate-400 hover:text-white transition-colors group">
                <i class="fa-solid fa-house group-hover:scale-110 transition-transform"></i>
            </button>
        </header>

        <!-- Джерело даних -->
        <section class="glass-card p-6 mb-8">
            <h3 class="text-xs font-black uppercase text-blue-400 mb-6 flex items-center tracking-widest">
                <i class="fa-solid fa-magnifying-glass mr-2"></i> Джерело даних
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="label-premium">Виберіть дату</label>
                    <input type="date" id="searchDate" class="input-premium" onchange="generateReport()">
                </div>
                <div>
                    <label class="label-premium">Виберіть підрозділ</label>
                    <select id="searchUnit" class="input-premium" onchange="generateReport()">
                        <option value="">Завантаження...</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="loadInitData(true)" class="btn-premium w-full shadow-emerald-500/20">
                        <i class="fa-solid fa-rotate"></i> Оновити дані
                    </button>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Ліва колонка: Параметри -->
            <div class="glass-card p-6 space-y-6">
                <div class="flex justify-between items-center border-b border-white/10 pb-4">
                    <h3 class="text-sm font-black uppercase text-slate-300 tracking-wider">Параметри звіту</h3>
                    <div id="saveStatus"
                        class="flex items-center gap-1.5 text-[10px] text-emerald-400 uppercase font-bold opacity-0 transition-opacity">
                        <i class="fa-solid fa-check-circle"></i> Збережено
                    </div>
                </div>

                <!-- Адресат -->
                <div>
                    <label class="label-premium">НВІПС/НВПС — Посада</label>
                    <input type="text" id="addresseePosition" oninput="triggerSave(); generateReport()"
                        placeholder="Начальнику відділу прикордонної служби..." class="input-premium">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="label-premium">Звання НВІПС/НВПС</label>
                        <input type="text" id="addresseeRank" oninput="triggerSave(); generateReport()"
                            placeholder="підполковнику" class="input-premium">
                    </div>
                    <div>
                        <label class="label-premium">ПІБ НВІПС/НВПС</label>
                        <input type="text" id="addresseeName" oninput="triggerSave(); generateReport()"
                            placeholder="Степану Бандері" class="input-premium">
                    </div>
                </div>

                <!-- Дата / ділянка -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="label-premium">Дата вильотів (у донесенні)</label>
                        <input type="text" id="reportDate" oninput="triggerSave(); generateReport()"
                            placeholder="10-11.09.2025" class="input-premium">
                    </div>
                    <div>
                        <label class="label-premium">Ділянка — віпс</label>
                        <input type="text" id="sectorVips" oninput="triggerSave(); generateReport()"
                            placeholder="«Чорна»" class="input-premium">
                    </div>
                </div>
                <div>
                    <label class="label-premium">Ділянка — впс</label>
                    <input type="text" id="sectorVps" oninput="triggerSave(); generateReport()"
                        placeholder="«Станіславка»" class="input-premium">
                </div>

                <!-- Район -->
                <div>
                    <label class="label-premium">Район виконання завдань (тільки координати через кому)</label>
                    <input type="text" id="taskAreaCoords" oninput="triggerSave(); generateReport()"
                        placeholder="47.775833, 29.532253, 47.789235, 29.525558, ..." class="input-premium">
                </div>

                <!-- Маршрут -->
                <div>
                    <label class="label-premium">Маршрут польотів</label>
                    <input type="text" id="reportRoute" oninput="triggerSave(); generateReport()"
                        placeholder="Новокрасне (Укр) - Михайлівка (РМ)" class="input-premium">
                </div>

                <!-- Екіпаж -->
                <div class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="label-premium">Оператор — Звання</label>
                            <input type="text" id="cmdRank" oninput="triggerSave(); generateReport()"
                                placeholder="штаб-сержант" class="input-premium">
                        </div>
                        <div>
                            <label class="label-premium">Оператор — ПІБ</label>
                            <input type="text" id="cmdName" oninput="triggerSave(); generateReport()"
                                placeholder="Тарас Шевченко" class="input-premium">
                        </div>
                    </div>

                </div>



                <!-- Метео -->
                <div class="pt-4 border-t border-white/5">
                    <label class="label-premium text-sky-400 flex items-center">
                        <i class="fa-solid fa-cloud-sun mr-2"></i> Метеоумови
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-3">
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-500 mb-1 block">Темп. °С</label>
                            <input type="text" id="weatherTemp" placeholder="+16"
                                oninput="triggerSave(); generateReport()" class="input-premium text-center">
                        </div>
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-500 mb-1 block">Вид. км</label>
                            <input type="text" id="weatherVis" placeholder="8-10"
                                oninput="triggerSave(); generateReport()" class="input-premium text-center">
                        </div>
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-500 mb-1 block">Напр. º</label>
                            <input type="number" id="weatherWindDir" placeholder="55"
                                oninput="triggerSave(); generateReport()" class="input-premium text-center">
                        </div>
                        <div>
                            <label class="text-[9px] uppercase font-bold text-slate-500 mb-1 block">Швидк. м/с</label>
                            <input type="number" id="weatherWindSpeed" placeholder="6"
                                oninput="triggerSave(); generateReport()" class="input-premium text-center">
                        </div>
                    </div>
                </div>

                <!-- Результат -->
                <div class="pt-4 border-t border-white/5">
                    <label class="label-premium text-yellow-500">Результат виконання</label>
                    <select id="resultType" class="input-premium mt-1" onchange="toggleResultInput(); generateReport()">
                        <option value="none">Порушень не виявлено</option>
                        <option value="detained">Затримано правопорушників</option>
                    </select>
                    <div id="detainedCountWrapper" class="hidden mt-4">
                        <label class="label-premium">Кількість осіб</label>
                        <input type="number" id="detainedCount" min="1" value="1" class="input-premium"
                            oninput="generateReport()">
                    </div>
                </div>

                <!-- Фото -->
                <div class="pt-4 border-t border-white/5">
                    <label class="label-premium text-blue-400 flex items-center">
                        <i class="fa-solid fa-camera mr-2"></i> Фотоматеріали
                    </label>
                    <div class="flex items-center gap-4 mt-2">
                        <label
                            class="cursor-pointer bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 py-3 px-6 rounded-xl border border-blue-500/30 transition-all flex-grow text-center text-xs font-bold uppercase tracking-widest">
                            <i class="fa-solid fa-upload mr-2"></i> Вибрати фото
                            <input type="file" id="reportImages" multiple accept="image/*" class="hidden"
                                onchange="previewImages()">
                        </label>
                    </div>
                    <div id="imagePreviewContainer" class="flex gap-4 flex-wrap mt-6"></div>
                </div>
            </div>

            <!-- Права колонка: Перегляд -->
            <div class="glass-card p-6 flex flex-col min-h-[600px]">
                <div class="flex flex-wrap justify-between items-center mb-6 gap-4 border-b border-white/10 pb-4">
                    <h3 class="text-sm font-black uppercase text-slate-300 tracking-wider">Попередній перегляд</h3>
                    <div class="flex gap-2">
                        <button onclick="copyReport()" class="btn-premium btn-secondary !p-3 shadow-none"
                            title="Копіювати текст">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <button onclick="downloadWord()" id="btnDownload" class="btn-premium shadow-emerald-500/30">
                            <i class="fa-solid fa-file-word"></i>
                            <span id="btnDownloadText">Скачати DOCX</span>
                        </button>
                    </div>
                </div>
                <textarea id="finalReport"
                    class="input-premium flex-grow !bg-transparent !border-none !shadow-none resize-none leading-relaxed text-sm scrollbar-thin overflow-y-auto"
                    readonly></textarea>
                <div
                    class="mt-6 flex justify-between items-center text-[10px] text-slate-500 font-bold uppercase tracking-widest">
                    <span>Система UAV Command</span>
                    <button onclick="downloadTestDoc()" class="hover:text-blue-400 transition-colors">Тестування
                        сервера</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/libs/db.js"></script>
    <script>
        let allFlights = [];
        let saveTimeout;

        function fmtTime(t) { return t ? t.substring(0, 5) : '--'; }

        function nav(path) {
            const token = new URLSearchParams(window.location.search).get('token');
            window.location.href = token ? `${path}?token=${token}` : path;
        }

        function triggerSave() {
            clearTimeout(saveTimeout);
            const status = document.getElementById('saveStatus');
            status.style.opacity = '1';
            saveTimeout = setTimeout(() => {
                saveLocal();
                setTimeout(() => { status.style.opacity = '0'; }, 1000);
            }, 500);
        }

        async function loadInitData(isRefresh = false) {
            if (!isRefresh) loadLocal();
            const unitSelect = document.getElementById('searchUnit');
            unitSelect.innerHTML = '<option value="">Синхронізація...</option>';
            const cachedMeta = await dbAPI.getMeta();
            if (cachedMeta) applyOptions(cachedMeta);
            try {
                const [resOpt, resFlights] = await Promise.all([
                    fetch("/api/get_options"),
                    fetch("/api/get_all_flights")
                ]);
                if (!resOpt.ok || !resFlights.ok) throw new Error("API Connection Error");
                const options = await resOpt.json();
                allFlights = await resFlights.json();
                applyOptions(options);
                dbAPI.saveMeta(options);
                const params = new URLSearchParams(window.location.search);
                const pDate = params.get('date');
                const pUnit = params.get('unit');
                const pRoute = params.get('route');
                if (pDate) document.getElementById('searchDate').value = pDate;
                else if (!document.getElementById('searchDate').value)
                    document.getElementById('searchDate').valueAsDate = new Date();
                if (pUnit) unitSelect.value = pUnit;
                if (pRoute) document.getElementById('reportRoute').value = pRoute;
                generateReport();
            } catch (e) {
                console.error("loadInitData Error:", e);
                if (!cachedMeta) dbAPI.showNotification("Помилка підключення до сервера. " + e.message, "error");
            }
        }

        function applyOptions(options) {
            const unitSelect = document.getElementById('searchUnit');
            unitSelect.innerHTML = '<option value="">Оберіть підрозділ...</option>';
            options.units.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u; opt.text = u;
                unitSelect.appendChild(opt);
            });
        }

        // ─── JSON-бланк ───────────────────────────────────────────────────────
        function buildReportJson() {
            const date = document.getElementById('searchDate').value;
            const unit = document.getElementById('searchUnit').value;
            const rDate = document.getElementById('reportDate').value
                || (date ? date.split('-').reverse().join('.') : '___');

            const currentOperator = localStorage.getItem('uav_op') || '';
            const filtered = allFlights.filter(f =>
                f.date === date &&
                f.unit?.trim() === unit?.trim() &&
                f.result !== 'Польоти не здійснювались' &&
                (!currentOperator || f.operator?.trim().toLowerCase() === currentOperator.trim().toLowerCase())
            );

            const statsMap = {};
            const uniqueDrones = new Set();
            filtered.forEach(f => {
                const op = f.operator || 'Невідомий';
                const dr = f.drone || 'БпЛА';
                uniqueDrones.add(dr);
                const key = `${op}_${dr}`;
                if (!statsMap[key]) statsMap[key] = { operator: op, drone: dr, count: 0, sorties: [] };
                statsMap[key].count++;
                statsMap[key].sorties.push({
                    time_start: fmtTime(f.takeoff),
                    time_end: fmtTime(f.landing),
                    distance_m: f.distance || 0
                });
            });

            const coordsRaw = document.getElementById('taskAreaCoords').value.trim();
            const coordNums = coordsRaw
                ? coordsRaw.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n))
                : [];
            const coordPairs = [];
            for (let i = 0; i + 1 < coordNums.length; i += 2)
                coordPairs.push({ lat: coordNums[i], lon: coordNums[i + 1] });

            const operators = [];

            // Ділянка для рядка "Зв'язок" — береться з тих самих полів, що й "Ділянка"
            const sectorVipsTrim = document.getElementById('sectorVips').value.trim();
            const sectorVpsTrim = document.getElementById('sectorVps').value.trim();
            const sectorParts = [];
            if (sectorVipsTrim) sectorParts.push(`віпс ${sectorVipsTrim}`);
            if (sectorVpsTrim) sectorParts.push(`впс ${sectorVpsTrim}`);
            const sectorForComm = sectorParts.join(' ');

            const resType = document.getElementById('resultType').value;
            const resultDesc = resType === 'detained'
                ? `Виявлено та затримано ${document.getElementById('detainedCount').value || 1} правопорушників.`
                : 'Під час польотів порушень ОПДК не виявлено.';

            return {
                document_type: 'Донесення про політ',
                addressee: {
                    position: document.getElementById('addresseePosition').value || '',
                    rank: document.getElementById('addresseeRank').value || '',
                    name: document.getElementById('addresseeName').value || ''
                },
                title: 'Донесення про політ',
                dates: { label: 'Дата вильотів', value: rDate },
                sector: {
                    label: 'Ділянка',
                    vips: document.getElementById('sectorVips').value || '',
                    vps: document.getElementById('sectorVps').value || ''
                },
                task_area: {
                    label: 'Район виконання завдань',
                    coordinates: coordPairs
                },
                flights: {
                    label: 'Вильоти',
                    crew_members: Object.values(statsMap).map(item => ({
                        surname: item.operator,
                        total_flights: item.count,
                        aircraft_type: item.drone,
                        sorties: item.sorties
                    }))
                },
                route: {
                    label: 'Маршрут',
                    value: document.getElementById('reportRoute').value || '...'
                },
                aircraft: {
                    label: 'БпАК',
                    types: Array.from(uniqueDrones)
                },
                crew_composition: {
                    label: 'Склад екіпажу',
                    commander: {
                        rank: document.getElementById('cmdRank').value || '',
                        name: document.getElementById('cmdName').value || ''
                    },
                    operators: operators
                },
                results: {
                    label: 'Результати',
                    description: resultDesc
                },
                border_communication: {
                    label: "Зв'язок на кордоні підтримувався",
                    sector: sectorForComm,
                    means: 'по р/ст. по радіомережі',
                    documentation: 'відео-, фотодокументування здійснювалися штатною апаратурою БпАК'
                },
                weather: {
                    label: 'Погода по маршруту',
                    temperature_celsius: document.getElementById('weatherTemp').value || '0',
                    visibility_km: document.getElementById('weatherVis').value || '0',
                    cloud_cover_points: '2-3 бали вище висоти польоту',
                    wind_direction_deg: parseInt(document.getElementById('weatherWindDir').value) || 0,
                    wind_speed_ms: parseInt(document.getElementById('weatherWindSpeed').value) || 0,
                    hazardous_phenomena: 'не спостерігалось'
                },
                crew_readiness: {
                    label: 'Готовність екіпажу та стан БпАК',
                    aircraft_condition: 'БпАК справний',
                    flight_mode: 'Політ виконано в штатному режимі',
                    control_system_failures: 'відмов у системах керування не зафіксовано',
                    telemetry_failures: 'відмов у телеметрії не зафіксовано',
                    remarks: 'Зауважень немає'
                },
                compiled_by: {
                    label: 'Донесення склав',
                    role: 'Оператор',
                    rank: document.getElementById('cmdRank').value || '',
                    name: document.getElementById('cmdName').value || ''
                }
            };
        }

        // ─── Рендер тексту з JSON-бланку ─────────────────────────────────────
        function renderReportText(r) {
            const lines = [];
            const addr = r.addressee;

            if (addr.position) lines.push(addr.position);
            const addrLine = [addr.rank, addr.name].filter(Boolean).join(' ');
            if (addrLine) lines.push(addrLine);
            lines.push('');

            lines.push(r.title);
            lines.push('');

            lines.push(`Дата вильотів: ${r.dates.value}`);
            const sectorParts = [r.sector.vips && `віпс ${r.sector.vips}`, r.sector.vps && `впс ${r.sector.vps}`].filter(Boolean).join(' ');
            if (sectorParts) lines.push(`Ділянка: ${sectorParts}`);

            if (r.task_area.coordinates.length > 0) {
                const coordStr = r.task_area.coordinates.map(c => `${c.lat}, ${c.lon}`).join(', ');
                lines.push(`Район виконання завдань: ${coordStr}`);
            }
            lines.push('');

            lines.push('Вильоти:');
            if (r.flights.crew_members.length === 0) {
                lines.push('Польоти за вказаний період відсутні.');
                lines.push('');
            } else {
                r.flights.crew_members.forEach(m => {
                    lines.push(`${m.surname} — ${m.total_flights} польотів`);
                    lines.push(m.aircraft_type);
                    m.sorties.forEach(s => lines.push(`${s.time_start} - ${s.time_end} - ${s.distance_m} м`));
                    lines.push('');
                });
            }

            lines.push(`Маршрут: ${r.route.value}`);
            lines.push(`БпАК: ${r.aircraft.types.join(', ') || '____'}`);
            lines.push('');

            lines.push('Склад екіпажу:');
            const cc = r.crew_composition;
            lines.push(`оператор: ${[cc.commander.rank, cc.commander.name].filter(Boolean).join(' ')}`);
            if (cc.operators.length > 0) {
                const opsStr = cc.operators.map(o => [o.rank, o.name].filter(Boolean).join(' ')).join(', ');
                lines.push(`оператор: ${opsStr}`);
            }
            lines.push('');

            lines.push('Результати:');
            lines.push(r.results.description);
            lines.push('');

            const bc = r.border_communication;
            lines.push(`${bc.label}:`);
            const commLine = bc.sector ? `з ПН, ОЧ ${bc.sector} ${bc.means};` : `${bc.means};`;
            lines.push(commLine);
            if (bc.documentation) lines.push(`${bc.documentation}.`);
            lines.push('');

            const w = r.weather;
            lines.push(`${w.label}: температура повітря ${w.temperature_celsius}°С, польотна видимість ${w.visibility_km} км, хмарність ${w.cloud_cover_points}, вітер ${w.wind_direction_deg}º / ${w.wind_speed_ms} м/с, небезпечних явищ погоди ${w.hazardous_phenomena}.`);
            lines.push('');

            const cr = r.crew_readiness;
            lines.push(`${cr.label}: ${cr.aircraft_condition}, недоліків у роботі техніки не виявлено. ${cr.flight_mode}, ${cr.control_system_failures} та ${cr.telemetry_failures}. ${cr.remarks}.`);
            lines.push('');

            lines.push(r.compiled_by.label);
            lines.push(`${r.compiled_by.role}:`);
            lines.push([r.compiled_by.rank, r.compiled_by.name].filter(Boolean).join(' '));

            return lines.join('\n');
        }

        function generateReport() {
            // Auto-fill route from flight data when the route field is empty
            const date = document.getElementById('searchDate').value;
            const unit = document.getElementById('searchUnit').value;
            const currentOperator = localStorage.getItem('uav_op') || '';
            const routeField = document.getElementById('reportRoute');
            if (!routeField.value || routeField.value === 'Не вказано') {
                const match = allFlights.find(f =>
                    f.date === date &&
                    f.unit?.trim() === unit?.trim() &&
                    f.route && f.route !== 'Не вказано' &&
                    (!currentOperator || f.operator?.trim().toLowerCase() === currentOperator.trim().toLowerCase())
                );
                if (match) routeField.value = match.route;
            }
            const r = buildReportJson();
            document.getElementById('finalReport').value = renderReportText(r);
        }

        async function downloadWord() {
            const btn = document.getElementById('btnDownload');
            const date = document.getElementById('searchDate').value || new Date().toISOString().slice(0, 10);
            const unit = document.getElementById('searchUnit').value || 'ЗВІТ';
            const r = buildReportJson();

            const flightsData = r.flights.crew_members.map(m => ({
                operator: m.surname,
                drone: m.aircraft_type,
                count: m.total_flights,
                details: m.sorties.map(s => `${s.time_start} - ${s.time_end} (${s.distance_m} м)`).join('; ')
            }));

            const temp = r.weather.temperature_celsius;
            const weather = `температура повітря ${parseFloat(temp) > 0 ? '+' + temp : temp}°C, польотна видимість ${r.weather.visibility_km} км, хмарність ${r.weather.cloud_cover_points}, вітер ${r.weather.wind_direction_deg}º / ${r.weather.wind_speed_ms} м/с, небезпечних явищ погоди не спостерігалось`;

            const addr = r.addressee;
            const header = [addr.position, [addr.rank, addr.name].filter(Boolean).join(' ')].filter(Boolean).join('\n');
            const cmdFull = [r.compiled_by.rank, r.compiled_by.name].filter(Boolean).join(' ');
            const commanderShort = `${r.compiled_by.rank}                                          ${r.compiled_by.name}`.trim();

            let photoBase64 = null;
            const previewImgs = document.querySelectorAll('#imagePreviewContainer img');
            if (previewImgs.length > 0) photoBase64 = previewImgs[0].src;

            const reportData = {
                header,
                title: r.title,
                date: r.dates.value,
                unit,
                vips: r.sector.vips || '',
                sector_vps: r.sector.vps || '',
                task_area_coords: r.task_area.coordinates.map(c => `${c.lat}, ${c.lon}`).join(', '),
                flights: flightsData,
                result: r.results.description,
                weather,
                commander: cmdFull,
                route: r.route.value,
                operators: r.crew_composition.operators.map(o => [o.rank, o.name].filter(Boolean).join(' ')).join(', '),
                drones_list: r.aircraft.types.join(', ') || '____',
                commander_short: commanderShort,
                photo: photoBase64
            };

            const fileName = `Донесення_${date}.docx`;

            if (!navigator.onLine) {
                await dbAPI.addToSyncQueue('report', { reportData, fileName });
                alert("Офлайн режим: дані збережено. Звіт буде сформовано при наявності інтернету.");
                return;
            }

            btn.innerHTML = '<div class="spinner"></div> Формування...';
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('report_data', JSON.stringify(reportData));
                formData.append('filename', fileName);
                const res = await fetch('/api/generate_docx', { method: 'POST', body: formData });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(`Помилка сервера: ${res.status} — ${err}`);
                }
                const blob = await res.blob();
                const wordBlob = new Blob([blob], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
                saveAs(wordBlob, fileName);
                dbAPI.showNotification('DOCX завантажено!', 'success');
            } catch (e) {
                console.error('DOCX download error:', e);
                dbAPI.showNotification('Помилка: ' + e.message, 'error');
            } finally {
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-solid fa-file-word"></i> Скачати DOCX';
                    btn.disabled = false;
                }, 2000);
            }
        }

        async function downloadTestDoc() {
            const fileName = "ТЕСТ_УСПІХ.docx";
            try {
                const formData = new FormData();
                formData.append('report_data', JSON.stringify({ flights: [], header: "ТЕСТОВИЙ ДОКУМЕНТ\nУкраїнська мова працює!\nUTF-8 Check: Привіт Світ!", date: '__', unit: '__' }));
                formData.append('filename', fileName);
                const res = await fetch('/api/generate_docx', { method: 'POST', body: formData });
                if (!res.ok) throw new Error("Сервер не відповідає");
                const blob = await res.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(blobUrl); }, 1000);
            } catch (e) {
                alert("Помилка тестування: " + e.message);
            }
        }

        function toggleResultInput() {
            document.getElementById('detainedCountWrapper')
                .classList.toggle('hidden', document.getElementById('resultType').value !== 'detained');
        }

        function previewImages() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            Array.from(document.getElementById('reportImages').files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'photo-preview';
                    container.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        function copyReport() {
            const t = document.getElementById('finalReport');
            t.select();
            navigator.clipboard.writeText(t.value).then(() => {
                const btn = document.querySelector('[onclick="copyReport()"]');
                const oldHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                btn.classList.add('!bg-emerald-600');
                setTimeout(() => { btn.innerHTML = oldHtml; btn.classList.remove('!bg-emerald-600'); }, 1500);
            });
        }

        const SAVE_FIELDS = [
            'addresseePosition', 'addresseeRank', 'addresseeName',
            'reportDate', 'sectorVips', 'sectorVps', 'taskAreaCoords',
            'reportRoute', 'cmdRank', 'cmdName',
            'weatherTemp', 'weatherVis', 'weatherWindDir', 'weatherWindSpeed'
        ];

        function saveLocal() {
            SAVE_FIELDS.forEach(f => localStorage.setItem(f, document.getElementById(f).value));
        }

        function loadLocal() {
            SAVE_FIELDS.forEach(f => {
                const val = localStorage.getItem(f);
                if (val !== null) document.getElementById(f).value = val;
            });
            if (!document.getElementById('addresseePosition').value)
                document.getElementById('addresseePosition').value = 'Начальнику відділу організації повітряної розвідки та протидії безпілотним повітряним суднам штабу';
            if (!document.getElementById('addresseeRank').value)
                document.getElementById('addresseeRank').value = 'підполковнику';
            if (!document.getElementById('addresseeName').value)
                document.getElementById('addresseeName').value = 'Армену МКРТЧЯН';
        }

        window.addEventListener('online', async () => {
            const queue = await dbAPI.getSyncQueue();
            if (!queue || queue.length === 0) return;
        });

        window.onload = () => loadInitData();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.log('SW Registration Failed:', err));
            });
        }
    </script>
